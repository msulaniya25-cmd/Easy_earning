<!DOCTYPE html>
<html>
<head>
  <title>OTP Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <h3>OTP टेस्टिंग</h3>
  <input type="text" id="phoneNumber" placeholder="+919876543210" style="padding: 10px; width: 220px; font-size: 16px;">
  <div id="recaptcha-container" style="margin: 15px 0;"></div>
  <button onclick="sendOTP()" style="padding: 10px 20px; font-size: 16px; background: blue; color: white; border: none; border-radius: 5px;">OTP भेजें</button>

  <br><br><br>
  <input type="text" id="otpCode" placeholder="6 अंकों का OTP डालें" style="padding: 10px; width: 220px; font-size: 16px;">
  <button onclick="verifyOTP()" style="padding: 10px 20px; font-size: 16px; background: green; color: white; border: none; border-radius: 5px;">OTP चेक करें</button>

  <p id="status" style="color: blue; font-weight: bold; margin-top: 20px;"></p>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyAN14Sb7I6Uw2TiUBTj4Idkr332LKVjFGg",
      authDomain: "://firebaseapp.com",
      projectId: "easy-earning-6214b",
      storageBucket: "easy-earning-6214b.firebasestorage.app",
      messagingSenderId: "23572662346",
      appId: "1:23572662346:web:cb7c359e3aa9a589793eb3",
      measurementId: "G-WZT4CLCRKD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {});

    window.sendOTP = function() {
      const phone = document.getElementById('phoneNumber').value;
      document.getElementById('status').innerText = "OTP भेजा जा रहा है...";
      
      signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
        .then((confirmationResult) => {
          window.confirmationResult = confirmationResult;
          document.getElementById('status').innerText = "OTP भेज दिया गया है! अपना फोन चेक करें।";
        }).catch((error) => {
          document.getElementById('status').innerText = "Error: " + error.message;
        });
    }

    window.verifyOTP = function() {
      const code = document.getElementById('otpCode').value;
      window.confirmationResult.confirm(code).then((result) => {
        document.getElementById('status').innerText = "बधाई हो! OTP बिल्कुल सही है।";
      }).catch((error) => {
        document.getElementById('status').innerText = "गलत OTP या Error: " + error.message;
      });
    }
  </script>
</body>
</html>
