<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Easy Earning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { color: #38bdf8; margin-bottom: 15px; font-size: 24px; }
    .card { background: #1e293b; padding: 18px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    input { width: 100%; padding: 11px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; }
    .btn { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-primary { background: #38bdf8; color: #0f172a; width: 100%; }
    .btn-green { background: #10b981; color: #fff; font-size: 12px; }
    .btn-red { background: #ef4444; color: #fff; font-size: 12px; }
    .item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div id="adminLogin" class="container" style="margin-top:50px;">
    <div class="card">
      <h1>🔐 Admin Login</h1>
      <input type="password" id="adminPass" placeholder="Enter Admin Password">
      <button onclick="checkAdmin()" class="btn btn-primary">Open Dashboard</button>
    </div>
  </div>

  <div id="adminDash" class="container hidden">
    <h1>⚙️ Easy Earning Admin</h1>

    <div class="card">
      <h3 style="margin-bottom:10px;">➕ Add New Task / Offer Link</h3>
      <input type="text" id="tTitle" placeholder="Task Title (e.g. Install App & Register)">
      <input type="text" id="tDesc" placeholder="Short Description">
      <input type="number" id="tReward" placeholder="User Reward in USD (e.g. 0.20)" step="0.01">
      <input type="text" id="tUrl" placeholder="Your Offer / Affiliate / Ad Link (https://...)">
      <button onclick="addTask()" class="btn btn-primary">Publish Task</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">📋 Active Tasks</h3>
      <div id="tasksList">Loading...</div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:10px;">💸 Withdrawal Requests</h3>
      <div id="withdrawList">Loading...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://esm.sh';
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from 'https://esm.sh';

    const app = initializeApp({
      apiKey: "AIzaSyAN14Sb7I6Uw2TiUBTj4Idkr332LKVjFGg",
      authDomain: "://firebaseapp.com",
      projectId: "easy-earning-6214b"
    });
    const db = getFirestore(app);

    window.checkAdmin = () => {
      if (document.getElementById('adminPass').value === "admin123") {
        document.getElementById('adminLogin').classList.add('hidden');
        document.getElementById('adminDash').classList.remove('hidden');
        loadAll();
      } else {
        alert("Wrong Admin Password!");
      }
    };

    window.addTask = async () => {
      const title = document.getElementById('tTitle').value;
      const desc = document.getElementById('tDesc').value;
      const reward = document.getElementById('tReward').value;
      const url = document.getElementById('tUrl').value;
      if (!title || !reward || !url) return alert("Fill all fields!");

      await addDoc(collection(db, "tasks"), { title, desc, reward: parseFloat(reward), url });
      alert("Task Added!");
      document.getElementById('tTitle').value = "";
      document.getElementById('tDesc').value = "";
      document.getElementById('tReward').value = "";
      document.getElementById('tUrl').value = "";
      loadAll();
    };

    window.delTask = async (id) => {
      await deleteDoc(doc(db, "tasks", id));
      loadAll();
    };

    window.markPaid = async (id) => {
      await updateDoc(doc(db, "withdrawals", id), { status: "Paid" });
      alert("Marked as Paid!");
      loadAll();
    };

    async function loadAll() {
      const tSnap = await getDocs(collection(db, "tasks"));
      const tBox = document.getElementById('tasksList');
      tBox.innerHTML = tSnap.empty ? "No tasks added yet." : "";
      tSnap.forEach(d => {
        const t = d.data();
        tBox.innerHTML += `<div class="item"><strong>${t.title}</strong> ($${t.reward})<br><small>${t.url}</small><br><button onclick="delTask('${d.id}')" class="btn btn-red" style="margin-top:6px;">Delete</button></div>`;
      });

      const wSnap = await getDocs(collection(db, "withdrawals"));
      const wBox = document.getElementById('withdrawList');
      wBox.innerHTML = wSnap.empty ? "No withdrawal requests." : "";
      wSnap.forEach(d => {
        const w = d.data();
        wBox.innerHTML += `<div class="item">
          <strong>${w.email}</strong> — $${w.amount} via <b>${w.method}</b><br>
          Details: <code>${w.details}</code> | Status: <b>${w.status}</b><br>
          ${w.status === "Pending" ? `<button onclick="markPaid('${d.id}')" class="btn btn-green" style="margin-top:6px;">Mark Paid</button>` : ""}
        </div>`;
      });
    }
  </script>
</body>
</html>
